services:
  portfolio:
    image: ${PORTFOLIO_IMAGE:-personal-portfolio-tui:local}
    build:
      context: .
    ports:
      - "127.0.0.1:2222:2222"
    volumes:
      - host-key:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    stop_grace_period: 10s
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

volumes:
  host-key:
