[package]
name = "personal-portfolio-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Aidan Jeon's terminal portfolio for local terminals and SSH"
repository = "https://github.com/aidanjnn/personal-portfolio-ssh"
publish = false

[dependencies]
# Pin the unstable buffered-backend API the SSH renderer writes frames through.
ratatui = { version = "=0.30.2", features = ["unstable-backend-writer"] }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.63.3", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
rand = "0.10"
unicode-properties = { version = "0.1.5", default-features = false, features = ["emoji", "general-category"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"

[dev-dependencies]
regex = "1"
