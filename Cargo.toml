[package]
name = "personal-portfolio-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Aidan Jeon's terminal portfolio for local terminals and SSH"
repository = "https://github.com/aidanjnn/personal-portfolio-ssh"
publish = false

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[dev-dependencies]
rand = "0.10"
