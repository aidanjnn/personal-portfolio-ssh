# Production stack for the Azure VM. Lives at /opt/portfolio/compose.prod.yaml.
# deploy/bootstrap.sh installs it and starts it.
#
#   cd /opt/portfolio
#   TAG=v0.1.0 docker compose -f compose.prod.yaml pull
#   TAG=v0.1.0 docker compose -f compose.prod.yaml up -d
#
# Without TAG, compose falls back to :latest.
# NEVER run `docker compose down -v`: it deletes the SSH host key volume.

# A fixed project name keeps volume names stable (portfolio_host-key, ...)
# no matter which directory the file is run from.
name: portfolio

x-hardening: &hardening
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  init: true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "1m"
      max-file: "3"

services:
  portfolio:
    <<: *hardening
    image: ghcr.io/aidanjnn/personal-portfolio-ssh:${TAG:-latest}
    command:
      - serve
      - --bind
      - 0.0.0.0:2222
      - --host-key
      - /data/ssh_host_ed25519_key
      # 32 sessions of a few MiB each fit the 256 MiB cap below on a 1 GiB VM.
      - --max-sessions
      - "32"
      - --max-per-ip
      - "3"
      - --idle-timeout
      - "300"
      - --max-session-secs
      - "1800"
      - --content-url
      - https://www.aidanjeon.com/portfolio.json
    ports:
      # Host :22 only binds once OpenSSH no longer listens on it;
      # deploy/bootstrap.sh masks OpenSSH before it starts the stack.
      - "22:2222"
      # Fallback for networks that block outbound 22.
      - "2222:2222"
    volumes:
      # Holds the persistent server identity. Generated once, backed up
      # offline, never regenerated.
      - host-key:/data
    networks:
      - ssh
    stop_grace_period: 10s
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64

  caddy:
    <<: *hardening
    image: caddy:2.10
    # The image's caddy binary carries the cap_net_bind_service file
    # capability. With cap_drop: ALL it cannot exec unless the capability
    # stays in the bounding set.
    cap_add:
      - NET_BIND_SERVICE
    # TCP only: the NSG admits no UDP, and the Caddyfile turns HTTP/3 off.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certificates and ACME account: keep it
      - caddy-config:/config
    tmpfs:
      - /tmp
    networks:
      - web
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 64

# The two services never talk to each other, so they get separate networks.
networks:
  ssh:
  web:

volumes:
  host-key:
  caddy-data:
  caddy-config:
