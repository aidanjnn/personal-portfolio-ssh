name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

# Actions are pinned to commit SHAs; see deploy.yml for how to bump them.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup ships on GitHub's runners, so no third-party action is needed. It installs
      # the toolchain and components pinned in rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustc --version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v
      - run: python3 -B scripts/smoke.py --ssh
